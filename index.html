<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CET4 单词练习</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #eef3fb 0%, #f7f9fc 45%, #fdf6ee 100%);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 16px; color: #26324a;
  }
  .app { width: 100%; max-width: 560px; }
  .card {
    background: #fff; border-radius: 24px; padding: 28px 26px 22px;
    box-shadow: 0 18px 50px rgba(38, 70, 140, .12);
    position: relative;
    transition: background-color .45s ease, box-shadow .4s ease, transform .42s cubic-bezier(.34,1.3,.64,1);
  }
  .card.zh2en { background: #e9f7ee; }
  .card.switching { transform: scale(.972); box-shadow: 0 10px 30px rgba(38, 70, 140, .1); }
  @keyframes quizIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }
  #quiz.quiz-in { animation: quizIn .38s ease; }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .logo { font-weight: 700; font-size: 17px; color: #2f57a8; letter-spacing: .5px; }
  .logo span { color: #f0913c; }
  .score { font-size: 13px; color: #7d8aa5; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .tl { display: flex; align-items: center; gap: 8px; }
  .toolbar .lbl { font-size: 12.5px; color: #8a97ae; }
  .toolbar select {
    border: 1.5px solid #e3eaf6; background: #fafcff; color: #2b3a55;
    border-radius: 10px; padding: 7px 10px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .toolbar select:focus { outline: none; border-color: #9db8ee; }
  .auto-speak { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #8a97ae; cursor: pointer; user-select: none; }
  .auto-speak input { accent-color: #4c7cf0; }
  .bar { height: 6px; background: #edf1f8; border-radius: 99px; overflow: hidden; margin-bottom: 22px; }
  .bar i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #4c7cf0, #f0913c); border-radius: 99px; transition: width .3s; }
  .word { text-align: center; margin: 8px 0 6px; position: relative; }
  .flag-box {
    position: absolute; right: 6px; top: 4px;
    width: 46px; height: 46px; padding: 0;
    border: 2px solid #cbd6ea; border-radius: 12px; background: #fff;
    color: #219a5b; font-size: 24px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all .15s;
  }
  .flag-box:hover { border-color: #9db8ee; background: #f2f7ff; }
  .flag-box.on { border-color: #3bb273; background: #eaf8f0; }
  .mode-btn {
    position: absolute; top: -14px; right: -36px; z-index: 6;
    border: none; background: linear-gradient(135deg, #4c7cf0, #6a5cf0);
    color: #fff; padding: 10px 12px 20px;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 72%, 0 100%);
    font-size: 12px; font-weight: 700; letter-spacing: .5px;
    cursor: pointer; white-space: nowrap;
    filter: drop-shadow(0 7px 12px rgba(76,124,240,.28));
    transition: filter .15s, transform .15s;
  }
  .mode-btn:hover { filter: drop-shadow(0 9px 16px rgba(76,124,240,.42)); transform: translateY(-1px); }
  .word .en { font-size: 42px; font-weight: 800; letter-spacing: 1px; color: #1f3a6b; word-break: break-all; }
  .word .ph { font-size: 15px; color: #93a0b8; margin-top: 6px; }
  .spk {
    border: none; background: #f1f5fb; border-radius: 50%; width: 40px; height: 40px;
    font-size: 18px; cursor: pointer; margin-top: 12px; transition: all .15s;
  }
  .spk:hover { background: #e3ecff; transform: scale(1.06); }
  .spk:active { transform: scale(.94); }
  .opts { display: grid; gap: 12px; margin-top: 22px; }
  .opt {
    text-align: left; border: 2px solid #e3eaf6; background: #fafcff;
    border-radius: 14px; padding: 14px 16px; font-size: 16px; color: #2b3a55;
    cursor: pointer; transition: all .15s; line-height: 1.45;
  }
  .opt:hover:not(.disabled) { border-color: #9db8ee; background: #f2f7ff; transform: translateY(-1px); }
  .opt.correct { border-color: #3bb273; background: #eaf8f0; color: #1f7a4d; }
  .opt.wrong { border-color: #e05d5d; background: #fdeeee; color: #b63636; }
  .opt.disabled { cursor: default; }
  .opt .mark { float: right; font-weight: 700; }
  .feedback { margin-top: 16px; min-height: 24px; text-align: center; font-size: 15px; font-weight: 600; }
  .feedback.good { color: #219a5b; }
  .feedback.bad { color: #c94a4a; }
  .bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; gap: 8px; }
  .btn {
    border: none; border-radius: 12px; padding: 12px 16px; font-size: 15px;
    font-weight: 600; cursor: pointer; transition: all .15s;
  }
  .btn.primary { background: linear-gradient(135deg, #4c7cf0, #6a5cf0); color: #fff; box-shadow: 0 8px 20px rgba(76,124,240,.3); }
  .btn.primary:hover { transform: translateY(-1px); }
  .btn.ghost { background: #f1f5fb; color: #5a6c8a; }
  .btn.ghost:hover { background: #e7eefb; }
  .btn:disabled { opacity: .45; cursor: default; }
  .hint { text-align: center; font-size: 12.5px; color: #9aa7be; margin-top: 14px; line-height: 1.6; }
  .summary { text-align: center; padding: 20px 0 6px; display: none; }
  .summary .big { font-size: 40px; font-weight: 800; color: #2f57a8; }
  .summary .sub { color: #7d8aa5; margin: 10px 0 22px; line-height: 1.7; }
  .review { display: inline-block; margin-top: 10px; }

  .mask {
    position: fixed; inset: 0; background: rgba(20, 32, 56, .38);
    display: none; align-items: center; justify-content: center; padding: 18px; z-index: 50;
  }
  .mask.show { display: flex; }
  .panel {
    background: #fff; border-radius: 20px; width: 100%; max-width: 520px;
    max-height: 82vh; display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 24px 60px rgba(20, 40, 90, .25);
  }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 18px; border-bottom: 1px solid #eef2f8;
  }
  .panel-head b { font-size: 16px; color: #22355c; }
  .panel-head b span { color: #f0913c; }
  .panel-actions { display: flex; gap: 8px; }
  .mini { border: none; border-radius: 9px; padding: 7px 11px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .mini.primary { background: #eaf1ff; color: #3560c0; }
  .mini.ghost { background: #f2f4f8; color: #7b879d; }
  .mini.ghost:hover { background: #e8ebf2; }
  .wrong-list { overflow-y: auto; padding: 8px 14px 16px; }
  .wrong-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 12px 6px; border-bottom: 1px dashed #eef2f8;
  }
  .wrong-row:last-child { border-bottom: none; }
  .wr-main { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; min-width: 0; }
  .wr-word { font-size: 17px; font-weight: 700; color: #1f3a6b; }
  .wr-ph { font-size: 12px; color: #9aa7be; }
  .wr-m { font-size: 13.5px; color: #5c6b85; flex-basis: 100%; word-break: break-all; }
  .wr-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .wr-count { font-size: 12.5px; font-weight: 700; color: #c94a4a; background: #fdeeee; border-radius: 99px; padding: 4px 10px; }
  .mini-spk { border: none; background: #f1f5fb; border-radius: 50%; width: 28px; height: 28px; font-size: 13px; cursor: pointer; }
  .mini-spk:hover { background: #e3ecff; }
  .mini-del { border: none; background: none; color: #a8b3c8; font-size: 12px; cursor: pointer; }
  .mini-del:hover { color: #e05d5d; }
  .empty { text-align: center; color: #9aa7be; padding: 30px 0; font-size: 14px; }
</style>
</head>
<body>
<div class="app">
  <div class="card">
    <button class="mode-btn" id="modeBtn" title="切换出题模式">英→汉</button>
    <div class="top">
      <div class="logo">CET4 <span>单词练习</span></div>
      <div class="score" id="score">正确 0 / 0</div>
    </div>
    <div class="toolbar">
      <div class="tl">
        <span class="lbl">题量</span>
        <select id="perRound">
          <option value="10">10 题</option>
          <option value="20" selected>20 题</option>
          <option value="50">50 题</option>
          <option value="100">100 题</option>
        </select>
      </div>
      <label class="auto-speak"><input type="checkbox" id="autoSpeak"> 自动发音</label>
    </div>
    <div class="bar"><i id="bar"></i></div>

    <div id="quiz">
      <div class="word">
        <button class="flag-box" id="flagBox" title="标记重点(效果同答错)"></button>
        <div class="en" id="word">—</div>
        <div class="ph" id="phonetic"></div>
        <button class="spk" id="speakWord" title="点击发音">🔊</button>
      </div>
      <div class="opts" id="opts"></div>
      <div class="feedback" id="feedback"></div>
      <div class="bottom">
        <button class="btn ghost" id="restart">重新开始</button>
        <button class="btn ghost" id="openWrong">错词本(<span id="wrongBadge">0</span>)</button>
        <button class="btn primary" id="next" disabled>下一题</button>
      </div>
    </div>

    <div class="summary" id="summary">
      <div class="big" id="sumScore">0%</div>
      <div class="sub" id="sumText"></div>
      <button class="btn primary" id="again">再来一组</button>
      <button class="btn ghost" id="reviewWrong" style="margin-left:8px;">复习错词</button>
    </div>

    <div class="hint">按所选题量随机出题 · 一词多义随机考不同义项 · 点 🔊 可听发音 · 错词自动记入错词本</div>
  </div>
</div>

<div class="mask" id="wrongPanel">
  <div class="panel">
    <div class="panel-head">
      <b>错词本 <span id="wrongCount">(0)</span></b>
      <div class="panel-actions">
        <button class="mini primary" id="reviewAll">复习错词</button>
        <button class="mini ghost" id="clearAll">清空</button>
        <button class="mini ghost" id="closePanel">关闭</button>
      </div>
    </div>
    <div class="wrong-list" id="wrongList"></div>
  </div>
</div>

const POS_RE = /^(vt|vi|v|n|a|ad|adv|adj|prep|conj|pron|num|art|aux|int|interj|abbr)\./;
const ALL_SENSES = [];
const POS_POOL = {};
(function buildSenses() {
  const seen = new Set();
  for (const e of ALL) {
    for (const s of (e.s && e.s.length ? e.s : [e.m])) {
      const key = s.trim();
      if (!key || seen.has(key)) continue;
      seen.add(key);
      const item = { w: e.w, m: key };
      ALL_SENSES.push(item);
      const mm = key.match(POS_RE);
      const pos = mm ? mm[1] : "_other";
      (POS_POOL[pos] = POS_POOL[pos] || []).push(item);
    }
  }

function loadWrong() {
  try {
    const list = JSON.parse(localStorage.getItem(WRONG_KEY) || "[]");
    if (!Array.isArray(list)) return [];
    return list.map(x => ({ w: x.w, m: x.m, p: x.p || "", count: x.count || 1, last: x.last || Date.now() }));
  } catch (e) { return []; }
}
function saveWrong(list) { localStorage.setItem(WRONG_KEY, JSON.stringify(list.slice(0, 500))); }

(function migrate() {
  if (localStorage.getItem(WRONG_KEY)) return;
  try {
    const old = JSON.parse(localStorage.getItem(OLD_KEY) || "[]");
    if (Array.isArray(old) && old.length) {
      saveWrong(old.map(x => ({ w: x.w, m: x.m, p: x.p || "", count: x.count || 1, last: Date.now() })));
    }
  } catch (e) {}
})();

function addWrong(obj) {
  const list = loadWrong();
  const hit = list.find(x => x.w === obj.w);
  if (hit) { hit.count++; hit.m = obj.m; hit.p = obj.p || hit.p; hit.last = Date.now(); }

  updateBadge();
}

/* ---------- 已掌握计数(连续答对) ---------- */
function loadMastery() {
  try {
    const o = JSON.parse(localStorage.getItem(MASTER_KEY) || "{}");
    return (o && typeof o === "object") ? o : {};
  } catch (e) { return {}; }
}
function saveMastery(o) { localStorage.setItem(MASTER_KEY, JSON.stringify(o)); }
function bumpMastery(word, right) {
  const m = loadMastery();
  if (right) { m[word] = Math.min((m[word] || 0) + 1, 99); }
  else { m[word] = 0; }
  saveMastery(m);
}
function removeWrong(w) {
  saveWrong(loadWrong().filter(x => x.w !== w));
  renderWrongList();
}
function updateBadge() {
  const n = loadWrong().length;
  $("wrongBadge").textContent = n;
  $("wrongCount").textContent = "(" + n + ")";
}

/* ---------- 发音 ---------- */
function stopAudio() {
  if (currentAudio) { try { currentAudio.pause(); } catch (e) {} currentAudio = null; }
  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
}
function ttsSpeak(word) {
  try {
    if (!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(word);
    u.lang = "en-US";
    u.rate = 0.9;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function speak(word) {
  if (!word) return;
  stopAudio();
  const url = "https://dict.youdao.com/dictvoice?audio=" + encodeURIComponent(word) + "&type=2";
  try {
    const a = new Audio(url);
    currentAudio = a;
    a.onerror = function () { ttsSpeak(word); };
    const p = a.play();
    if (p && p.catch) p.catch(function () { ttsSpeak(word); });
  } catch (e) { ttsSpeak(word); }
}
/* ------------------------------ */

function weightedPick(list, n) {
  const wrongMap = new Map(loadWrong().map(x => [x.w, x.count]));
  const mastery = loadMastery();
  const items = list.map(w => {
    const wc = wrongMap.get(w.w) || 0;
    const st = mastery[w.w] || 0;
    let weight = 1 + wc * 2;
    if (st >= 3) weight *= 0.2;
    return { w: w, weight: weight };
  });
  const out = [];
  const count = Math.min(n, items.length);
  for (let i = 0; i < count; i++) {
    const total = items.reduce((s, x) => s + x.weight, 0);
    let r = Math.random() * total;
    let idx = 0;
    for (; idx < items.length - 1; idx++) { r -= items[idx].weight; if (r <= 0) break; }
    out.push(items[idx].w);
    items.splice(idx, 1);
  }
  return out;
}

function newRound(list, m) {
  const s = sess();
  s.pool = weightedPick(list, perRound()).map(q => ({ q: q, sense: pickSense(q) }));
  s.idx = 0; s.correct = 0; s.answered = 0; s.done = false;
  roundMode = m || "normal";
  locked = false;
  $("quiz").style.display = "block";
  $("summary").style.display = "none";
  renderQuestion();
}

function resumeRound() {
  const s = sess();
  locked = false;
  if (s.done || !s.pool.length) { showSummary(); return; }
  $("summary").style.display = "none";
  $("quiz").style.display = "block";
  renderQuestion();
}

function pickSense(entry) {
  const senses = (entry.s && entry.s.length) ? entry.s : [entry.m];
  return senses[Math.floor(Math.random() * senses.length)];
}

function pickDistractors(word, sense, n) {
  const used = new Set([sense]);
  const out = [];
  const mm = sense.match(POS_RE);
  const samePos = mm ? (POS_POOL[mm[1]] || []) : [];
  const pools = [samePos, ALL_SENSES];
  for (const arr of pools) {
    for (const r of arr) {
      if (out.length >= n) break;
      if (r.w === word || used.has(r.m)) continue;
      used.add(r.m);
      out.push(r.m);
    }
    if (out.length >= n) break;
  }
  return out;
}

function pickWordDistractors(word, sense, n) {
  const mm = sense.match(POS_RE);
  const samePos = mm ? (POS_POOL[mm[1]] || []) : [];
  const pools = [samePos, ALL_SENSES];
  const used = new Set([word.toLowerCase()]);
  const out = [];
  for (const arr of pools) {
    for (const r of arr) {
      if (out.length >= n) break;
      if (used.has(r.w.toLowerCase())) continue;
      used.add(r.w.toLowerCase());
      out.push(r.w);
    }
    if (out.length >= n) break;
  }
  return out;
}

function renderQuestion() {
  const s = sess();
  if (s.idx >= s.pool.length) { s.done = true; showSummary(); return; }
  const item = s.pool[s.idx];
  const q = item.q;
  const sense = item.sense;
  const isZh2En = displayMode === "zh2en";
  const qText = isZh2En ? sense : q.w;
  const aText = isZh2En ? q.w : sense;
  current = { w: q.w, m: sense, p: q.p || "", qText: qText, aText: aText };
  locked = false;
  setFlag(false);
  $("word").textContent = qText;
  $("phonetic").textContent = isZh2En ? "" : (q.p || "");
  $("speakWord").style.display = isZh2En ? "none" : "";
  $("feedback").textContent = "";
  $("feedback").className = "feedback";
  $("next").disabled = true;

  const distractors = isZh2En ? pickWordDistractors(q.w, sense, 3) : pickDistractors(q.w, sense, 3);
  const opts = shuffle([aText, ...distractors]);
  const box = $("opts");
  box.innerHTML = "";
  opts.forEach((m) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = m;
    b.onclick = () => choose(b, m);
    box.appendChild(b);
  });
  updateScore();
  if ($("autoSpeak").checked && !isZh2En) speak(q.w);
}

function choose(btn, m) {
  const s = sess();
  if (locked || !current) return;
  locked = true;
  s.answered++;
  const right = m === current.aText;
  const effective = right && !flagged;
  const buttons = [...document.querySelectorAll(".opt")];
  buttons.forEach(b => {
    b.classList.add("disabled");
    if (b.textContent === current.aText) { b.classList.add("correct"); b.insertAdjacentHTML("beforeend", '<span class="mark">✓</span>'); }
  });
  if (effective) {
    s.correct++;
    bumpMastery(current.w, true);
    $("feedback").textContent = "回答正确!";
    $("feedback").className = "feedback good";
  } else {
    if (!right) {
      btn.classList.add("wrong");
      btn.insertAdjacentHTML("beforeend", '<span class="mark">✗</span>');
    }
    if (!flagged) {
      bumpMastery(current.w, false);
      addWrong(current);
    }
    $("feedback").textContent = flagged ? "已标记重点,按错记录 · 正确答案:" + current.aText : "正确答案:" + current.aText;
    $("feedback").className = "feedback bad";
  }
  updateScore();
  $("next").disabled = false;
}

function updateScore() {
  const s = sess();
  $("score").textContent = "正确 " + s.correct + " / " + s.answered;
  const total = s.pool.length || 1;
  $("bar").style.width = Math.min(100, (s.answered / total) * 100).toFixed(1) + "%";
}

function showSummary() {
  $("quiz").style.display = "none";
  $("summary").style.display = "block";
  const s = sess();
  const pct = s.answered ? Math.round(s.correct / s.answered * 100) : 0;
  $("sumScore").textContent = pct + "%";
  $("sumText").textContent = "本组答对 " + s.correct + " / " + s.answered + " 题" + (pct >= 90 ? ",太棒了!" : pct >= 70 ? ",不错,继续加油!" : ",多练几遍会更稳。");
  const wrong = loadWrong();
  $("reviewWrong").style.display = wrong.length ? "inline-block" : "none";
  $("reviewWrong").textContent = "复习错词(" + wrong.length + ")";
}

function renderWrongList() {
  updateBadge();
  const list = loadWrong().sort((a, b) => b.count - a.count || b.last - a.last);
  const box = $("wrongList");
  box.innerHTML = "";
  if (!list.length) {
    box.innerHTML = '<div class="empty">错词本是空的,继续加油!</div>';
    return;
  }
  list.forEach(x => {
    const row = document.createElement("div");
    row.className = "wrong-row";
    const main = document.createElement("div");
    main.className = "wr-main";
    const w = document.createElement("span"); w.className = "wr-word"; w.textContent = x.w;
    const p = document.createElement("span"); p.className = "wr-ph"; p.textContent = x.p || "";
    const m = document.createElement("span"); m.className = "wr-m"; m.textContent = x.m;
    main.appendChild(w); main.appendChild(p); main.appendChild(m);
    const right = document.createElement("div");
    right.className = "wr-right";
    const spk = document.createElement("button"); spk.className = "mini-spk"; spk.textContent = "🔊"; spk.title = "发音";
    spk.onclick = () => speak(x.w);
    const c = document.createElement("span"); c.className = "wr-count"; c.textContent = "错 " + x.count + " 次";
    const del = document.createElement("button"); del.className = "mini-del"; del.textContent = "删除";
    del.onclick = () => removeWrong(x.w);
    right.appendChild(spk); right.appendChild(c); right.appendChild(del);
    row.appendChild(main); row.appendChild(right);
    box.appendChild(row);
  });
}

function openPanel() { renderWrongList(); $("wrongPanel").classList.add("show"); }
function closePanel() { $("wrongPanel").classList.remove("show"); }

$("next").onclick = () => { const s = sess(); s.idx++; renderQuestion(); };
$("restart").onclick = () => newRound(ALL, "normal");
$("again").onclick = () => newRound(ALL, "normal");
$("speakWord").onclick = () => { if (current) speak(current.w); };
$("flagBox").onclick = () => {
  if (flagged) { setFlag(false); return; }
  setFlag(true);
  if (current) { addWrong(current); bumpMastery(current.w, false); }
};
function applyModeClass() {
  document.querySelector(".card").classList.toggle("zh2en", displayMode === "zh2en");
}
function playSwitchEffect() {
  const card = document.querySelector(".card");
  card.classList.add("switching");
  setTimeout(() => card.classList.remove("switching"), 420);
  const quiz = $("quiz");
  quiz.classList.remove("quiz-in");
  void quiz.offsetWidth;
  quiz.classList.add("quiz-in");
}
$("modeBtn").onclick = () => {
  displayMode = displayMode === "en2zh" ? "zh2en" : "en2zh";
  $("modeBtn").textContent = displayMode === "en2zh" ? "英→汉" : "汉→英";
  applyModeClass();
  const s = sess();
  if (!s.pool.length) { newRound(ALL, "normal"); } else { resumeRound(); }
  playSwitchEffect();
};
$("perRound").onchange = () => {};
$("reviewWrong").onclick = () => {
  const wrong = loadWrong();
  if (!wrong.length) { alert("错词本是空的,先做题吧"); return; }
  newRound(wrong, "review");
};
$("openWrong").onclick = openPanel;
$("closePanel").onclick = closePanel;
$("reviewAll").onclick = () => {
  const wrong = loadWrong();
  if (!wrong.length) { alert("错词本是空的"); return; }
  closePanel();
  newRound(wrong, "review");
};
$("clearAll").onclick = () => {
  if (!loadWrong().length) return;
  if (confirm("确定要清空错词本吗?所有记录将被删除。")) {
    saveWrong([]);
    renderWrongList();
  }
};
$("wrongPanel").onclick = (e) => { if (e.target === $("wrongPanel")) closePanel(); };

newRound(ALL, "normal");
updateBadge();
applyModeClass();
</script>
